<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>時報タイマー</title>
<style>
  :root{
    --bg:#0E1A24;
    --panel:#152534;
    --line:#24384A;
    --amber:#D9A441;
    --amber-dim:#8A6A2E;
    --text:#EAE3D6;
    --muted:#6E8598;
    --stop:#B4553A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .card{
    width:min(92vw, 420px);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px 24px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    color:var(--muted);
    text-align:center;
    text-transform:uppercase;
    margin-bottom:18px;
  }
  .beacon{
    width:14px; height:14px;
    border-radius:50%;
    background:var(--amber-dim);
    margin:0 auto 22px;
    position:relative;
    transition:background .08s ease;
  }
  .beacon::after{
    content:"";
    position:absolute; inset:-14px;
    border-radius:50%;
    border:1px solid var(--amber-dim);
    opacity:0;
  }
  .beacon.pulse{ background:var(--amber); }
  .beacon.pulse::after{
    opacity:.9;
    animation:ring .9s ease-out;
  }
  @keyframes ring{
    from{ transform:scale(.6); opacity:.8; }
    to{ transform:scale(2.2); opacity:0; }
  }
  .clock{
    text-align:center;
    font-variant-numeric:tabular-nums;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:64px;
    font-weight:600;
    letter-spacing:.02em;
    line-height:1;
    color:var(--text);
  }
  .clock .colon{ color:var(--amber); }
  .said{
    text-align:center;
    margin-top:14px;
    min-height:22px;
    font-size:15px;
    color:var(--amber);
    letter-spacing:.04em;
  }
  .said.idle{ color:var(--muted); }
  .status{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    letter-spacing:.08em;
  }
  .controls{
    display:flex; gap:10px;
    margin-top:26px;
  }
  button{
    flex:1;
    padding:15px 0;
    border-radius:12px;
    border:1px solid var(--line);
    font-size:16px;
    font-weight:600;
    letter-spacing:.03em;
    background:transparent;
    color:var(--text);
    -webkit-appearance:none;
  }
  #startBtn{
    background:var(--amber);
    border-color:var(--amber);
    color:#241A08;
  }
  #startBtn:disabled{
    background:var(--panel);
    border-color:var(--line);
    color:var(--muted);
  }
  #stopBtn{
    color:var(--stop);
    border-color:var(--stop);
  }
  #stopBtn:disabled{
    color:var(--muted);
    border-color:var(--line);
  }
  .hint{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:16px;
    line-height:1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">時 報 読 み 上 げ</div>
    <div class="beacon" id="beacon"></div>
    <div class="clock" id="clock">--<span class="colon">:</span>--</div>
    <div class="said idle" id="said">停止中</div>
    <div class="status" id="status"></div>
    <div class="controls">
      <button id="startBtn">開始</button>
      <button id="stopBtn" disabled>停止</button>
    </div>
    <div class="hint">分の頭で「◯分」、以後は毎秒1〜59を読み上げます</div>
  </div>

<script>
(function(){
  var clockEl = document.getElementById('clock');
  var saidEl = document.getElementById('said');
  var statusEl = document.getElementById('status');
  var beaconEl = document.getElementById('beacon');
  var startBtn = document.getElementById('startBtn');
  var stopBtn = document.getElementById('stopBtn');

  var running = false;
  var timerId = null;
  var lastMinute = null;
  var voices = [];
  var jaVoice = null;

  function loadVoices(){
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    jaVoice = voices.find(function(v){ return v.lang === 'ja-JP'; }) ||
              voices.find(function(v){ return v.lang && v.lang.indexOf('ja') === 0; }) ||
              null;
  }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  function pulse(){
    beaconEl.classList.remove('pulse');
    void beaconEl.offsetWidth;
    beaconEl.classList.add('pulse');
  }

  function speak(text){
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    if (jaVoice) u.voice = jaVoice;
    u.rate = 1.05;
    window.speechSynthesis.speak(u);
    saidEl.textContent = text;
    saidEl.classList.remove('idle');
  }

  function tick(){
    var now = new Date();
    var m = now.getMinutes();
    var s = now.getSeconds();

    clockEl.innerHTML = pad(now.getHours()) + '<span class="colon">:</span>' + pad(m) + '<span class="colon">:</span>' + pad(s);
    pulse();

    if (s === 0 || lastMinute === null) {
      speak(m + '分');
    } else {
      speak(String(s));
    }
    lastMinute = m;

    scheduleNextTick();
  }

  function scheduleNextTick(){
    var now = new Date();
    var msToNextSecond = 1000 - now.getMilliseconds();
    timerId = setTimeout(tick, msToNextSecond);
  }

  function start(){
    if (running) return;
    running = true;
    lastMinute = null;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    statusEl.textContent = '実行中';
    tick();
  }

  function stop(){
    running = false;
    if (timerId) clearTimeout(timerId);
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusEl.textContent = '';
    saidEl.textContent = '停止中';
    saidEl.classList.add('idle');
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);

  (function paintIdleClock(){
    var now = new Date();
    clockEl.innerHTML = pad(now.getHours()) + '<span class="colon">:</span>' + pad(now.getMinutes()) + '<span class="colon">:</span>' + pad(now.getSeconds());
    if (!running) setTimeout(paintIdleClock, 1000);
  })();
})();
</script>
</body>
</html>
