<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Good Timer Sailing Pro</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #151821;
            --accent-green: #00ff66;
            --accent-green-dim: rgba(0, 255, 102, 0.15);
            --accent-blue: #0a84ff;
            --accent-orange: #ff9500;
            --accent-purple: #af52de;
            --text-main: #f2f2f7;
            --text-sub: #8e8e93;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 14px;
        }

        .timer-case {
            background: linear-gradient(165deg, #1d202d, #10121a);
            border: 1px solid #2e3344;
            padding: 28px 22px;
            border-radius: 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 6px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .brand-title span { color: var(--accent-green); }

        .badge-bt {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 14px;
            background: rgba(10, 132, 255, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(10, 132, 255, 0.3);
        }

        .badge-bt.active {
            background: var(--accent-green-dim);
            color: var(--accent-green);
            border-color: rgba(0, 255, 102, 0.3);
        }

        /* 1段目：大画面 LCD Display Area */
        .lcd-display {
            background-color: #040507;
            border: 2px solid #252936;
            border-radius: 24px;
            padding: 28px 12px 20px 12px;
            box-shadow: inset 0 6px 16px rgba(0,0,0,0.85);
            margin-bottom: 24px;
        }

        .lcd-status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            font-family: monospace;
            margin-bottom: 6px;
        }

        .time-text {
            font-size: 68px;
            font-weight: 800;
            color: var(--accent-green);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 25px rgba(0, 255, 102, 0.45);
            letter-spacing: -2px;
            line-height: 1;
            margin: 8px 0;
        }

        .sub-status {
            font-size: 13px;
            color: var(--text-sub);
            height: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 入力セクション共通スタイル */
        .input-section {
            background: #171924;
            border: 1px solid #2f3448;
            border-radius: 22px;
            padding: 16px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .section-icon {
            font-size: 32px;
            line-height: 1;
        }

        .input-section input[type="time"] {
            background: #06070a;
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            padding: 8px 10px;
            border-radius: 14px;
            outline: none;
            color-scheme: dark;
            text-align: center;
            flex-grow: 1;
            width: 100%;
        }

        /* 2段目：時刻セット */
        .target-box input[type="time"] {
            border: 2px solid var(--accent-orange);
        }

        /* 3段目：タイマーセット */
        .timer-box input[type="time"] {
            border: 2px solid var(--accent-purple);
        }

        /* 同一サイズの独立スタートボタン */
        .btn-action-start {
            color: white;
            border: none;
            padding: 16px 18px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            white-space: nowrap;
            min-width: 135px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }
