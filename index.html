<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Good Timer Sailing Pro</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #16181f;
            --accent-green: #00ff66;
            --accent-green-dim: rgba(0, 255, 102, 0.15);
            --accent-blue: #0a84ff;
            --accent-orange: #ff9500;
            --text-main: #f2f2f7;
            --text-sub: #8e8e93;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px 10px;
        }

        .timer-case {
            background: linear-gradient(145deg, #1c1e26, #111217);
            border: 1px solid #2a2d37;
            padding: 24px 18px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 6px;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .brand-title span { color: var(--accent-green); }

        .badge-bt {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 12px;
            background: rgba(10, 132, 255, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(10, 132, 255, 0.3);
        }

        .badge-bt.active {
            background: var(--accent-green-dim);
            color: var(--accent-green);
            border-color: rgba(0, 255, 102, 0.3);
        }

        /* LCD Display Area */
        .lcd-display {
            background-color: #050608;
            border: 2px solid #222530;
            border-radius: 20px;
            padding: 20px 10px 14px 10px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.8);
            margin-bottom: 16px;
        }

        .lcd-status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-sub);
            font-family: monospace;
            margin-bottom: 4px;
        }

        .time-text {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            font-size: 56px;
            font-weight: 700;
            color: var(--accent-green);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            letter-spacing: -2px;
            line-height: 1;
            margin: 6px 0;
        }

        .sub-status {
            font-size: 12px;
            color: var(--text-sub);
            height: 18px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 目標スタート時刻設定 */
        .target-time-box {
            background: #181a22;
            border: 1px solid #363b4d;
            border-radius: 18px;
            padding: 10px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .clock-icon {
            font-size: 28px;
            line-height: 1;
        }

        .target-time-box input[type="time"] {
            background: #050608;
            border: 2px solid var(--accent-orange);
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 12px;
            outline: none;
            color-scheme: dark;
            text-align: center;
            flex-grow: 1;
        }

        .btn-set-target {
            background: linear-gradient(135deg, #ff9500, #c67100);
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 149, 0, 0.3);
            white-space: nowrap;
        }

        .btn-set-target:active { transform: scale(0.95); }

        /* Presets */
        .presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .preset-btn {
            background: #1e2029;
            color: var(--text-main);
            border: 1px solid #2e3240;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
        }

        .preset-btn:active { background: #2a2d3d; transform: scale(0.96); }

        /* Fine Adjust Grid */
        .adjust-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .adjust-btn {
            background: #252834;
            color: var(--text-main);
            border: 1px solid #363b4d;
            padding: 10px 0;
            font-size: 12px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
        }

        .adjust-btn:active { background: #3a3f52; transform: scale(0.96); }

        /* Control Buttons Grid */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            appearance: none;
            border: none;
            outline: none;
            padding: 16px 8px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        button:active { transform: scale(0.96); }

        .btn-start { background: linear-gradient(135deg, #00ff66, #00b347); color: #000; }
        .btn-stop { background: linear-gradient(135deg, #ff453a, #c62828); color: white; }
        .btn-reset { background: #2c2c2e; color: var(--text-main); border: 1px solid #3a3a3c; }

        .safeguard-note {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 14px;
            font-size: 11px;
            color: var(--text-sub);
            text-align: left;
            line-height: 1.4;
        }

        audio { display: none; }
    </style>
</head>
<body>

<div class="timer-case">
    <!-- Header -->
    <div class="brand-header">
        <div class="brand-title">GOOD <span>TIMER</span></div>
        <div class="badge-bt" id="btBadge">● BT / SLP READY</div>
    </div>

    <!-- LCD Display -->
    <div class="lcd-display">
        <div class="lcd-status-bar">
            <span id="modeStatus">READY</span>
            <span id="bgStatus">AUDIO: OFF</span>
        </div>
        <div class="time-text" id="display">00:00:00</div>
        <div class="sub-status" id="statusText">時刻またはボタンで時間設定</div>
    </div>

    <!-- 目標スタート時刻設定 -->
    <div class="target-time-box">
        <span class="clock-icon">🕰️</span>
        <input type="time" id="targetTimeInput">
        <button class="btn-set-target" onclick="setTargetTimeStart()">予約セット</button>
    </div>

    <!-- プリセット -->
    <div class="presets">
        <button class="preset-btn" onclick="setPreset(1)">1分</button>
        <button class="preset-btn" onclick="setPreset(3)">3分</button>
        <button class="preset-btn" onclick="setPreset(5)">5分</button>
    </div>

    <!-- 微調整 -->
    <div class="adjust-grid">
        <button class="adjust-btn" onclick="addTime(600)">+10分</button>
        <button class="adjust-btn" onclick="addTime(60)">+1分</button>
        <button class="adjust-btn" onclick="addTime(10)">+10秒</button>
        <button class="adjust-btn" onclick="addTime(1)">+1秒</button>
    </div>

    <!-- 操作ボタン -->
    <div class="btn-grid">
        <button class="btn-start" id="startBtn" onclick="handleStart()">スタート</button>
        <button class="btn-stop" id="stopBtn" onclick="handleStop()">ストップ</button>
        <button class="btn-reset" id="resetBtn" onclick="handleReset()">リセット</button>
    </div>

    <div class="safeguard-note">
        <strong>⛵ ヨットレース/スリープ対策済</strong><br>
        画面消灯や他アプリ移行時もBluetooth接続・バックグラウンド動作を自動維持。カウントダウン音声＆アナウンスが響きます。
    </div>
</div>

<audio id="silentAudio" loop playsinline preload="auto"></audio>

<script>
const SILENT_WAV_BASE64 = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";

let timeLeft = 0;
let mainTimerId = null;
let audioCtx = null;
let wakeLock = null;
let isSpeechUnlocked = false;
let lastAnnouncedSecond = -1; // 同じ秒数で2度喋るのを防止するフラグ

const display = document.getElementById('display');
const statusText = document.getElementById('statusText');
const modeStatus = document.getElementById('modeStatus');
const bgStatus = document.getElementById('bgStatus');
const btBadge = document.getElementById('btBadge');
const silentAudio = document.getElementById('silentAudio');
const targetTimeInput = document.getElementById('targetTimeInput');

silentAudio.src = SILENT_WAV_BASE64;

// ユーザー操作時に安全に音声エンジンをアクティブ化（SpeechSynthesisロック解除）
function unlockAudioEngine() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    // iOS/Edgeでの音声合成エンジン初期化（ダミー音声を登録してロック解除）
    if ('speechSynthesis' in window && !isSpeechUnlocked) {
        try {
            const dummyUttr = new SpeechSynthesisUtterance(' ');
            dummyUttr.lang = 'ja-JP';
            dummyUttr.volume = 0.01;
            window.speechSynthesis.speak(dummyUttr);
            isSpeechUnlocked = true;
        } catch(e) {}
    }

    if ('mediaSession' in navigator) {
        try {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: "Good Timer KeepAlive",
                artist: "Sailing Race Engine",
                album: "Background Safeguard"
            });
            navigator.mediaSession.setActionHandler('play', () => handleStart());
            navigator.mediaSession.setActionHandler('pause', () => handleStop());
        } catch(e) {}
    }

    silentAudio.play().then(() => {
        bgStatus.textContent = "AUDIO: ACTIVE";
        btBadge.classList.add('active');
    }).catch(e => console.log("Audio play deferred", e));
}

async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) {}
}

function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (mainTimerId && modeStatus.textContent === "RUNNING") requestWakeLock();
    }
});

// 秒針のチクタク音
function playTick() {
    unlockAudioEngine();
    if (!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1000, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
}

// 読み上げ処理（安全なキュー追加方式）
function speak(text) {
    if (!('speechSynthesis' in window)) return;
    unlockAudioEngine();
    try {
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.3; // アナウンスの遅れを防ぐためやや早め
        uttr.pitch = 1.0;
        uttr.volume = 1.0;
        window.speechSynthesis.speak(uttr);
    } catch(e) {
        console.log("Speech error:", e);
    }
}

// ご指定のカウントダウンルールに基づくロジック
function announceCountdown(seconds) {
    if (seconds < 0 || seconds === lastAnnouncedSecond) return;

    let textToSpeak = null;

    // 0秒ジャスト（スタート）
    if (seconds === 0) {
        textToSpeak = "時間になりました";
    }
    // 1. ラスト30秒以下: 1秒刻みのカウントダウン（「29」「28」…「3」「2」「1」）
    else if (seconds < 30) {
        textToSpeak = `${seconds}`;
    }
    // 2. 残り30秒～1分30秒 (30秒〜90秒): 10秒ごと（例: 「残り1分20秒」「残り1分10秒」…「残り30秒」）
    else if (seconds >= 30 && seconds <= 90) {
        if (seconds % 10 === 0) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            if (m > 0 && s > 0) {
                textToSpeak = `残り${m}分${s}秒`;
            } else if (m > 0) {
                textToSpeak = `残り${m}分`;
            } else {
                textToSpeak = `残り${s}秒`;
            }
        }
    }
    // 3. 残り1分30秒～10分 (90秒〜600秒): 30秒ごと（例: 「残り5分」「残り4分30秒」…「残り1分30秒」）
    else if (seconds > 90 && seconds <= 600) {
        if (seconds % 30 === 0) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            if (s === 0) {
                textToSpeak = `残り${m}分`;
            } else {
                textToSpeak = `残り${m}分30秒`;
            }
        }
    }
    // 4. 残り10分～30分 (600秒〜1800秒): 10分ごと（例: 「残り20分」「残り10分」）
    else if (seconds > 600 && seconds <= 1800) {
        if (seconds % 600 === 0) {
            textToSpeak = `残り${seconds / 60}分`;
        }
    }
    // 5. 残り30分～10時間 (1800秒〜36000秒): 30分ごと（例: 「残り1時間」「残り30分」）
    else if (seconds > 1800 && seconds <= 36000) {
        if (seconds % 1800 === 0) {
            const hrs = Math.floor(seconds / 3600);
            const mins = (seconds % 3600) / 60;
            if (hrs > 0 && mins > 0) {
                textToSpeak = `残り${hrs}時間${mins}分`;
            } else if (hrs > 0) {
                textToSpeak = `残り${hrs}時間`;
            } else {
                textToSpeak = `残り${mins}分`;
            }
        }
    }

    if (textToSpeak) {
        lastAnnouncedSecond = seconds;
        speak(textToSpeak);
    }
}

function updateDisplay() {
    const hrs = Math.floor(timeLeft / 3600).toString().padStart(2, '0');
    const mins = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
    const secs = (timeLeft % 60).toString().padStart(2, '0');
    display.textContent = `${hrs}:${mins}:${secs}`;
}

function setTargetTimeStart() {
    unlockAudioEngine();
    const val = targetTimeInput.value;
    if (!val) {
        statusText.textContent = "時刻を選択してください";
        return;
    }

    const now = new Date();
    const parts = val.split(":");
    const target = new Date();
    target.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);

    if (target <= now) {
        target.setDate(target.getDate() + 1);
    }

    const diffSec = Math.floor((target - now) / 1000);
    
    handleStop();
    timeLeft = diffSec;
    lastAnnouncedSecond = -1;
    updateDisplay();
    statusText.textContent = `${val} スタートで予約セットしました`;
    modeStatus.textContent = "SET";
    
    handleStart();
}

function setPreset(minutes) {
    unlockAudioEngine();
    handleStop();
    timeLeft = minutes * 60;
    lastAnnouncedSecond = -1;
    updateDisplay();
    statusText.textContent = `${minutes}分にセットしました`;
    modeStatus.textContent = "SET";
}

function addTime(seconds) {
    unlockAudioEngine();
    if (mainTimerId) handleStop();
    timeLeft += seconds;
    if (timeLeft > 359999) timeLeft = 359999;
    lastAnnouncedSecond = -1;
    updateDisplay();
    modeStatus.textContent = "SET";
    statusText.textContent = `時間を追加しました`;
}

// 1秒ごとの更新処理
function onTimerTick() {
    timeLeft--;
    updateDisplay();
    playTick();

    announceCountdown(timeLeft);

    // 0秒ジャスト（スタート）
    if (timeLeft <= 0) {
        handleStop();
        modeStatus.textContent = "FINISHED";
        statusText.textContent = "スタート（時間になりました）！";
    }
}

function handleStart() {
    unlockAudioEngine();
    requestWakeLock();

    if (modeStatus.textContent === "RUNNING") return;
    if (timeLeft <= 0) {
        statusText.textContent = "時間を設定してください";
        return;
    }

    if (mainTimerId) clearInterval(mainTimerId);
    
    playTick();
    mainTimerId = setInterval(onTimerTick, 1000);

    modeStatus.textContent = "RUNNING";
    statusText.textContent = "タイマー作動中...";
}

function handleStop() {
    if (mainTimerId) {
        clearInterval(mainTimerId);
        mainTimerId = null;
    }
    releaseWakeLock();
    if (modeStatus.textContent === "RUNNING") {
        modeStatus.textContent = "PAUSED";
        statusText.textContent = "一時停止中";
    }
}

function handleReset() {
    handleStop();
    timeLeft = 0;
    lastAnnouncedSecond = -1;
    updateDisplay();
    modeStatus.textContent = "READY";
    statusText.textContent = "リセットしました";
}

document.addEventListener('touchstart', unlockAudioEngine, { passive: true });
document.addEventListener('click', unlockAudioEngine, { passive: true });
</script>
</body>
</html>
